[package]
name = "photo-viewer-advanced"
version = "1.0.0"
description = "Fast, private desktop image viewer"
authors = ["Photo Viewer Advanced"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.90"

[lib]
name = "photo_viewer_advanced_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
tempfile = "3"
semver = "1"
sha2 = "0.10"
roxmltree = "0.21"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Graphics_Dwm"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"

